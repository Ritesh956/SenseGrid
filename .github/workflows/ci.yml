name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`. `latest` already broke this workflow once:
          # bumping the actions to their node24 majors changed which
          # golangci-lint major it resolved to (v1.64.8 -> v2.13.2), which
          # surfaced 5 new findings on a commit that touched no Go code. An
          # unpinned linter turns every upstream release into a potential
          # red build on an unchanged repo. Bump this deliberately, so the
          # new findings land in a commit that's actually about them.
          version: v2.13.2
          # golangci-lint's prebuilt binary release can lag behind the
          # newest Go toolchain (it refuses to analyze a module whose go.mod
          # targets a newer Go version than it was itself built with) —
          # goinstall builds it from source with the runner's own Go
          # toolchain (matched to go.mod via go-version-file above) instead
          # of downloading a binary, sidestepping that version race.
          install-mode: goinstall

      - name: Test
        run: go test ./... -race

      - name: Build all services
        run: |
          mkdir -p bin
          for svc in ingest processor control fleet hostagent; do
            go build -o bin/$svc ./cmd/$svc
          done
