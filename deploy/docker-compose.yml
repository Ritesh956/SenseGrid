networks:
  sensegrid:

volumes:
  mosquitto_data:
  nats_data:
  timescale_data:
  redis_data:
  prometheus_data:
  grafana_data:
  # chaos_data/fleet_data are deliberately host bind mounts (below), not
  # named volumes: control and fleet both run as distroless nonroot
  # (uid 65532), and a fresh named volume is created root-owned with no
  # chown mechanism available (no shell in the image) — the same reason
  # ./certs is already a bind mount rather than a volume. See
  # test/chaos/README.md.

x-go-service: &go-service
  build:
    context: ..
    dockerfile: deploy/docker/go.Dockerfile
  networks: [sensegrid]
  volumes:
    - ./certs:/certs:ro
  environment: &go-env
    SENSEGRID_ENV: ${SENSEGRID_ENV:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tls://mosquitto:8883}
    MQTT_BRIDGE_USERNAME: ${MQTT_BRIDGE_USERNAME:-ingest-bridge}
    MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?set MQTT_BRIDGE_PASSWORD in .env}
    NATS_URL: ${NATS_URL:-nats://nats:4222}
    POSTGRES_DSN: postgres://${POSTGRES_USER:-sensegrid}:${POSTGRES_PASSWORD:-sensegrid-dev}@timescaledb:5432/${POSTGRES_DB:-sensegrid}?sslmode=verify-ca&sslrootcert=/certs/ca.pem
    REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
    TLS_CA_FILE: ${TLS_CA_FILE:-/certs/ca.pem}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-jaeger:4317}

services:
  mosquitto:
    build:
      context: ..
      dockerfile: deploy/docker/mosquitto.Dockerfile
    networks: [sensegrid]
    environment:
      MOSQUITTO_ADMIN_USER: ${MOSQUITTO_ADMIN_USER:-admin}
      MOSQUITTO_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?set MOSQUITTO_ADMIN_PASSWORD in .env}
    ports:
      - "8883:8883" # TLS, service-to-service
      - "9001:9001" # TLS websockets, the PWA sensor client
    volumes:
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # A plain TCP check, not a full MQTT round-trip: the dynamic-security
      # plugin has no anonymous access at all (see mosquitto.conf), and its
      # own credentials aren't provisioned until cmd/control's bootstrap
      # runs after this healthcheck already needs to be passing.
      test: ["CMD", "nc", "-z", "-w", "3", "localhost", "8883"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    networks: [sensegrid]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  timescaledb:
    build:
      context: ..
      dockerfile: deploy/docker/timescaledb.Dockerfile
    networks: [sensegrid]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensegrid-dev}
      POSTGRES_DB: ${POSTGRES_DB:-sensegrid}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sensegrid} -d ${POSTGRES_DB:-sensegrid}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks: [sensegrid]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  jaeger:
    # All-in-one Jaeger accepts OTLP directly (gRPC on 4317), which is
    # enough to satisfy Phase 2's DoD — pull a reading's trace by
    # trace_id — without standing up a separate OTel Collector in front of
    # it. A standalone collector earns its place once something needs
    # collector-side sampling or fan-out to more than one backend, which
    # is a Phase 6+ concern, not this one.
    image: jaegertracing/all-in-one:latest
    networks: [sensegrid]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # trace query UI
      - "4317:4317" # OTLP gRPC

  prometheus:
    # Scrapes ingest/processor/control's /metrics (Phase 6) — see
    # deploy/prometheus/prometheus.yml. Host 9090 (Prometheus' own
    # default) is commonly already taken by something else on a dev
    # machine, so it's mapped to 9190 instead, same reasoning as the
    # console's 3100/3000 mapping (Phase 5).
    image: prom/prometheus:latest
    networks: [sensegrid]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9190:9090"

  grafana:
    # Dashboards + alert rules provisioned as code (deploy/grafana/**) —
    # nothing to click through in the UI to reproduce this stack. admin/admin
    # is fine here, matching this project's existing dev-only-credentials
    # posture (the dev CA, Mosquitto's hardcoded admin default, etc.).
    image: grafana/grafana:latest
    networks: [sensegrid]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3300:3000"
    depends_on:
      - prometheus

  # --- Go services -----------------------------------------------------
  # hostagent is deliberately not a compose service: it exists to read the
  # *host* machine's real CPU/battery/WiFi metrics (Phase 1), which a
  # container can't see. Run it natively with `make run-hostagent`.

  ingest:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE: ingest
    environment:
      <<: *go-env
      HTTP_ADDR: ":8081"
    ports:
      - "8081:8081"
    depends_on:
      mosquitto:
        condition: service_healthy
      nats:
        condition: service_healthy

  processor:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/docker/processor.Dockerfile
    environment:
      <<: *go-env
      HTTP_ADDR: ":8082"
      RULES_FILE: /rules/rules.yaml
    volumes:
      - ./certs:/certs:ro
      # Bind-mounted (not baked in only) so editing the host file
      # demonstrates Phase 3's rules hot-reload live, no rebuild/restart —
      # see internal/rules.Watcher and deploy/docker/processor.Dockerfile.
      - ./rules.yaml:/rules/rules.yaml:ro
    ports:
      - "8082:8082"
    depends_on:
      nats:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  control:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/docker/control.Dockerfile
    environment:
      <<: *go-env
      HTTP_ADDR: ":8080"
      HTTP_TLS_CERT_FILE: /certs/control.pem
      HTTP_TLS_KEY_FILE: /certs/control.key
      MQTT_ADMIN_USERNAME: ${MOSQUITTO_ADMIN_USER:-admin}
      MQTT_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?set MOSQUITTO_ADMIN_PASSWORD in .env}
      MQTT_CONTROL_USERNAME: ${MQTT_CONTROL_USERNAME:-control-plane}
      MQTT_CONTROL_PASSWORD: ${MQTT_CONTROL_PASSWORD:?set MQTT_CONTROL_PASSWORD in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      METRICS_ADDR: ":9091"
    volumes:
      - ./certs:/certs:ro
      - ../test/chaos/data:/chaos-data # `token create -count N -out /chaos-data/...` for cmd/fleet — see test/chaos/README.md
    ports:
      - "8090:8080" # host 8080 was already in use on the dev machine; HTTPS
      - "9091:9091" # Phase 6 /metrics — plain HTTP, matching ingest/processor's existing host-exposed convention
    depends_on:
      mosquitto:
        condition: service_healthy
      nats:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  fleet:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE: fleet
    environment:
      <<: *go-env
      HTTP_ADDR: ":8083"
      # Inert by default (FLEET_TARGET_DEVICES unset -> 0, see cmd/fleet's
      # main.go doc comment) — test/chaos's scripts scale it up over
      # POST /fleet/scale. CONTROL_URL is the in-network hostname, same
      # pattern as the console BFF's CONTROL_API_URL above.
      CONTROL_URL: https://control:8080
      FLEET_TARGET_DEVICES: ${FLEET_TARGET_DEVICES:-0}
      FLEET_TOKENS_FILE: ${FLEET_TOKENS_FILE:-/chaos-data/fleet-tokens.txt}
      FLEET_STATE_DIR: /data/fleet-devices
    volumes:
      - ./certs:/certs:ro
      - ../test/chaos/data:/chaos-data:ro
      - ../test/chaos/fleet-data:/data
    ports:
      - "8083:8083"
    depends_on:
      mosquitto:
        condition: service_healthy
      control:
        condition: service_started

  # --- Console (Phase 5) -------------------------------------------------
  console:
    build:
      context: ..
      dockerfile: deploy/docker/console.Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined into the client bundle at `next
        # build` time, not read at container start — this has to be a
        # build arg, not a runtime environment: entry below (see
        # console.Dockerfile's doc comment). Host-exposed port, not the
        # Docker-internal one: the browser can't resolve "control".
        NEXT_PUBLIC_CONTROL_WS_URL: ${NEXT_PUBLIC_CONTROL_WS_URL:-wss://localhost:8090/v1/ws}
    networks: [sensegrid]
    volumes:
      - ./certs:/certs:ro
    environment:
      # Docker-internal hostname — the console's Next.js BFF route
      # handlers call cmd/control server-side (see web/console/src/lib/
      # control-api.ts).
      CONTROL_API_URL: https://control:8080
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3100}
    ports:
      # Host 3000 is commonly already taken by another project's dev
      # server — 3100 avoids that collision without changing anything
      # inside the container (still listens on 3000 there).
      - "3100:3000"
    depends_on:
      - control
