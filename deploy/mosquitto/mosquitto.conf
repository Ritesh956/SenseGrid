# SenseGrid dev broker.
#
# allow_anonymous is true on both listeners for now: per-device credentials,
# ACLs (each device restricted to sensegrid/v1/{own_id}/#), and the dynamic
# security plugin land in Phase 1 (provisioning) / Phase 3 (enforcement).
# TLS is on from Phase 0 regardless, since it's a transport decision, not an
# auth decision.

# Real traffic: TLS only.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
allow_anonymous true

# Loopback-only, plaintext: used solely by the container healthcheck.
# Not published in docker-compose.yml, so it is not reachable from outside
# the container's own network namespace.
listener 1883 localhost
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
