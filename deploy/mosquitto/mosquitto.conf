# SenseGrid dev broker.
#
# Auth/ACLs are handled entirely by the dynamic-security plugin (bootstrapped
# by entrypoint.sh, managed at runtime by cmd/control — see
# internal/dynsec). Every device gets its own username/password and is
# restricted to sensegrid/v1/{own_id}/# via the shared "device" role's
# %c-substituted ACLs; there is no broker-wide allow_anonymous fallback.

# Service-to-service traffic (Go clients, future ingest bridge): TLS only.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false

# Browser clients (the PWA sensor client): MQTT-over-WebSockets, also TLS.
# The PWA is served over HTTPS (DeviceMotion/DeviceOrientation require a
# secure context), so a plain ws:// listener here would be blocked outright
# by the browser's mixed-content policy — it has to be wss://. Same
# self-signed dev cert as above: the phone's browser needs one manual
# "proceed anyway" past the certificate warning, once, the first time it
# opens https://<this-host>:9001/ directly (see the Phase 1 notes).
listener 9001
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false

persistence true
persistence_location /mosquitto/data/
log_dest stdout

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
