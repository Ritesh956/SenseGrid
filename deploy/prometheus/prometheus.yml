# Phase 6 scrape config, extended in Phase 7 for cmd/fleet. Every target is a Docker-network hostname:port —
# Prometheus lives on the same `sensegrid` network as everything else (see
# deploy/docker-compose.yml), so none of this depends on host port mappings.
# cmd/control's target is its separate plain-HTTP metrics port
# (METRICS_ADDR, :9091 by default), not its HTTPS API port — see
# internal/config's doc comment on MetricsAddr for why.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ingest
    static_configs:
      - targets: ["ingest:8081"]

  - job_name: processor
    static_configs:
      - targets: ["processor:8082"]

  - job_name: control
    static_configs:
      - targets: ["control:9091"]

  # cmd/fleet's /metrics shares its main HTTP_ADDR (:8083), matching
  # ingest/processor's convention rather than control's separate port —
  # fleet has no HTTPS listener to keep it off of. See
  # test/chaos/ramp.sh, which reads sensegrid_processor_end_to_end_latency_seconds
  # and sensegrid_ingest_lag_seconds (not fleet's own metrics) for the
  # latency-vs-fleet-size curve; fleet's counters are for its own health
  # during a chaos run.
  - job_name: fleet
    static_configs:
      - targets: ["fleet:8083"]
