; SenseGrid ESP32 firmware (Phase 9 — optional credibility layer).
; Deliberately targets arduino-esp32 core 2.x's timer/watchdog API
; (timerBegin(num, divider, countUp), timerAlarmWrite/Enable,
; esp_task_wdt_init(seconds, panic)) rather than core 3.x's newer, cleaner
; one (timerBegin(freq_hz), esp_task_wdt_config_t) — found live: the
; official PlatformIO `espressif32` platform doesn't ship core 3.x at all
; (only the community pioarduino fork does), so targeting 3.x's API here
; would fail to compile on the toolchain most people actually have,
; including whatever Wokwi's own cloud build uses. Pinning the platform
; version keeps this assumption from silently breaking under a
; `pio pkg update`.
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    beegee-tokyo/DHT sensor library for ESPx@^1.19.0
build_flags =
    -DCORE_DEBUG_LEVEL=2
